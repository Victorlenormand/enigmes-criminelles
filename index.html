<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dossier N-00</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* ── SCREENS ── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    .screen.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ── SCREEN 1 ── */
    #screen-1 {
      background: #000;
      gap: 0;
    }

    /* stamp */
    .stamp-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 3rem;
    }

    .stamp {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 8px solid #c0392b;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: stampCrash 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      transform-origin: center center;
      opacity: 0;
    }

    .stamp::before,
    .stamp::after {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 3px solid #c0392b;
    }
    .stamp::after {
      inset: 16px;
    }

    .stamp-text {
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #c0392b;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.3;
      user-select: none;
    }

    @keyframes stampCrash {
      0%   { transform: scale(3) rotate(-8deg); opacity: 0; }
      60%  { transform: scale(0.92) rotate(2deg); opacity: 1; }
      80%  { transform: scale(1.05) rotate(-1deg); opacity: 1; }
      100% { transform: scale(1) rotate(-3deg); opacity: 1; }
    }

    /* intro text */
    .intro-text {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      color: #f5f0e0;
      font-size: 1.15rem;
      line-height: 1.9;
      text-align: center;
      max-width: 520px;
      padding: 0 1.5rem;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 1.5s;
      margin-bottom: 2.5rem;
    }

    /* form */
    .entry-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
      animation-delay: 2.8s;
    }

    .entry-form input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #555;
      color: #f5f0e0;
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 1rem;
      padding: 0.5rem 0.25rem;
      width: 260px;
      text-align: center;
      outline: none;
      transition: border-color 0.3s;
    }
    .entry-form input::placeholder {
      color: #666;
      letter-spacing: 0.05em;
    }
    .entry-form input:focus {
      border-bottom-color: #c0392b;
    }

    .btn-open {
      margin-top: 0.5rem;
      background: transparent;
      border: 1px solid #c0392b;
      color: #c0392b;
      font-family: 'Arial', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.65rem 2rem;
      cursor: pointer;
      transition: background 0.25s, color 0.25s;
    }
    .btn-open:hover {
      background: #c0392b;
      color: #000;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SCREEN 2 (placeholder) ── */
    #screen-2 {
      background: #000;
    }
    #screen-2 p {
      color: #555;
      font-family: 'Playfair Display', serif;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- SCREEN 1 -->
  <div id="screen-1" class="screen active">
    <div class="stamp-wrapper">
      <div class="stamp">
        <span class="stamp-text">CONFIDENTIEL</span>
      </div>
    </div>

    <p class="intro-text">
      Ce dossier n'était pas censé quitter les archives.<br>
      Il est maintenant entre vos mains.
    </p>

    <div class="entry-form">
      <input
        type="text"
        id="input-nom"
        placeholder="Votre nom de code"
        autocomplete="off"
        maxlength="40"
      />
      <button class="btn-open" id="btn-open">&#9654; Ouvrir le dossier</button>
    </div>
  </div>

  <!-- SCREEN 2 -->
  <div id="screen-2" class="screen">
    <p id="screen2-greeting">…</p>
  </div>

  <script>
    var enqueteurNom = '';

    document.getElementById('btn-open').addEventListener('click', function () {
      var val = document.getElementById('input-nom').value.trim();
      enqueteurNom = val || 'Inconnu';
      goToScreen('screen-2');
      document.getElementById('screen2-greeting').textContent =
        'Bienvenue, ' + enqueteurNom + '.';
    });

    document.getElementById('input-nom').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('btn-open').click();
    });

    function goToScreen(id) {
      document.querySelectorAll('.screen').forEach(function (s) {
        s.classList.remove('active');
      });
      document.getElementById(id).classList.add('active');
    }
  </script>
</body>
</html>
