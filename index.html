<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Énigmes Criminelles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <meta name="description" content="Énigmes Criminelles — 20 affaires policières à résoudre en ligne. Mots mêlés, déduction, logique.">
  <meta name="robots" content="index, follow">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      text-align: center;
      max-width: 600px;
    }
    .hero h1 {
      font-size: clamp(2.4rem, 7vw, 5rem);
      letter-spacing: 0.08em;
      line-height: 1.05;
    }
    .hero-sub {
      font-family: var(--font-corps);
      font-size: clamp(1rem, 1.8vw, 1.2rem);
      font-style: italic;
      color: var(--or-clair);
      opacity: 0.85;
      max-width: 42ch;
      line-height: 1.6;
    }
    .hero-btns {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem;
      margin-top: 0.4rem;
    }
    .btn-primary {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--or);
      border: 1px solid var(--or);
      padding: 0.7em 2em;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.22s, color 0.22s;
    }
    .btn-primary:hover { background: var(--or-clair); border-color: var(--or-clair); }
    .hero-badge {
      font-family: var(--font-mono);
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      color: var(--or);
      opacity: 0.45;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <nav id="top-nav">
    <a class="brand" href="index.html">ÉNIGMES CRIMINELLES</a>
    <div class="links" id="nav-links">
      <a data-page="affaires" href="affaires.html">Affaires</a>
      <a data-page="livres" href="livres.html">Livres</a>
      <a data-page="compte" id="nav-compte" href="inscription.html">Mon compte</a>
    </div>
    <button id="nav-hamburger" aria-label="Menu" aria-expanded="false">☰</button>
  </nav>
  <div id="nav-mobile-panel">
    <a href="affaires.html">Affaires</a>
    <a href="livres.html">Livres</a>
    <a id="nav-mobile-compte" href="inscription.html">Mon compte</a>
  </div>

  <main class="page-home">
    <div class="hero">

      <span class="hero-badge">// Dossier classifié — Accès restreint //</span>

      <h1>ÉNIGMES<br/>CRIMINELLES</h1>

      <p class="hero-sub">
        20 affaires criminelles à résoudre.<br/>
        Trouvez le tueur, la méthode et le lieu.
      </p>

      <div class="divider"></div>

      <div class="hero-btns" id="hero-btns">
        <!-- injecté par JS selon état connexion -->
      </div>

    </div>
  </main>

  <script src="./js/auth.js"></script>
  <script>
    (function () {
      var fc = document.createElement('canvas'); fc.width = fc.height = 32;
      var x = fc.getContext('2d');
      x.fillStyle = '#0a0a0a'; x.fillRect(0, 0, 32, 32);
      x.strokeStyle = '#c9a84c'; x.lineWidth = 2.5; x.lineCap = 'round';
      x.beginPath(); x.arc(13, 13, 7, 0, Math.PI * 2); x.stroke();
      x.beginPath(); x.moveTo(18, 18); x.lineTo(26, 26); x.stroke();
      var lk = document.createElement('link'); lk.rel = 'icon'; lk.href = fc.toDataURL();
      document.head.appendChild(lk);
    }());

    document.addEventListener('DOMContentLoaded', function () {
      var btns = document.getElementById('hero-btns');
      if (isLoggedIn()) {
        btns.innerHTML =
          '<a class="btn-primary" href="affaires.html">Continuer l\'enquête &rarr;</a>' +
          '<a class="btn" href="livres.html">Voir les livres &rarr;</a>';
      } else {
        btns.innerHTML =
          '<a class="btn-primary" href="inscription.html">Commencer l\'enquête &rarr;</a>' +
          '<a class="btn" href="livres.html">Voir les livres &rarr;</a>';
      }
    });
  </script>

</body>
</html>
