<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Énigmes Criminelles — Carte de Paris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    html, body { overflow: hidden; }

    #map-paris {
      position: fixed;
      top: 3.2rem;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0a0a0a;
    }

    /* ── Marqueurs personnalisés ── */
    .marker-pin {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid rgba(245,240,232,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier Prime', monospace;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .marker-pin:hover { transform: scale(1.2); }
    .marker-ouvert    { background: #c9a84c; }
    .marker-resolu    { background: #2d5a27; }
    .marker-verrouille{ background: rgba(80,80,80,0.7); border-color: rgba(255,255,255,0.15); }

    /* ── Tooltip Leaflet ── */
    .leaflet-tooltip.carte-tip {
      background: #1a1510;
      border: 1px solid rgba(201,168,76,0.5);
      color: #f5f0e8;
      font-family: 'Playfair Display', serif;
      font-size: 0.78rem;
      padding: 0.5em 0.8em;
      border-radius: 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      white-space: nowrap;
    }
    .leaflet-tooltip.carte-tip::before { display: none; }
    .tip-num   { font-family: 'Courier Prime', monospace; font-size: 0.6rem; letter-spacing: 0.12em; color: #c9a84c; opacity: 0.7; }
    .tip-titre { font-style: italic; }
    .tip-badge { font-family: 'Courier Prime', monospace; font-size: 0.58rem; letter-spacing: 0.1em; margin-top: 0.2em; }

    /* ── Popup Leaflet ── */
    .leaflet-popup-content-wrapper {
      background: #1a1510;
      border: 1px solid rgba(201,168,76,0.4);
      border-radius: 0;
      box-shadow: 0 6px 24px rgba(0,0,0,0.7);
      color: #f5f0e8;
      padding: 0;
    }
    .leaflet-popup-tip { background: #1a1510; }
    .leaflet-popup-content { margin: 0; }
    .popup-inner {
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 200px;
    }
    .popup-num   { font-family:'Courier Prime',monospace; font-size:0.58rem; letter-spacing:0.15em; color:#c9a84c; opacity:0.6; }
    .popup-titre { font-family:'Playfair Display',serif; font-size:0.95rem; font-style:italic; }
    .popup-msg   { font-family:'Courier Prime',monospace; font-size:0.65rem; color:#f5f0e8; opacity:0.55; line-height:1.4; }
    .popup-btn   {
      display:inline-block; font-family:'Courier Prime',monospace;
      font-size:0.65rem; letter-spacing:0.14em; text-transform:uppercase;
      color:#c9a84c; border:1px solid rgba(201,168,76,0.5);
      padding:0.4em 0.9em; text-decoration:none; text-align:center;
      transition:background 0.2s, color 0.2s;
    }
    .popup-btn:hover { background:#c9a84c; color:#0a0a0a; }

    /* ── Légende ── */
    #carte-legende {
      position: fixed;
      bottom: 2rem;
      left: 0.8rem;
      z-index: 1000;
      background: rgba(10,10,10,0.88);
      border: 1px solid rgba(201,168,76,0.25);
      padding: 0.9rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      min-width: 190px;
      pointer-events: none;
    }
    .leg-titre {
      font-family:'Courier Prime',monospace; font-size:0.58rem;
      letter-spacing:0.18em; text-transform:uppercase;
      color:#c9a84c; opacity:0.6; margin-bottom:0.2rem;
    }
    .leg-row { display:flex; align-items:center; gap:0.5rem; }
    .leg-dot {
      width:10px; height:10px; border-radius:50%; flex-shrink:0;
    }
    .leg-dot.or    { background:#c9a84c; }
    .leg-dot.vert  { background:#2d5a27; border:1px solid #4a9a40; }
    .leg-dot.gris  { background:rgba(80,80,80,0.7); }
    .leg-label {
      font-family:'Courier Prime',monospace; font-size:0.62rem;
      letter-spacing:0.08em; color:#f5f0e8; opacity:0.65;
    }
    .leg-sep { height:1px; background:rgba(201,168,76,0.12); margin:0.1rem 0; }
    .leg-progress {
      font-family:'Courier Prime',monospace; font-size:0.62rem;
      letter-spacing:0.06em; color:#c9a84c; opacity:0.8;
    }
    .leg-grade {
      font-family:'Playfair Display',serif; font-size:0.72rem;
      font-style:italic; color:#e8d5a3; opacity:0.7;
    }
  </style>
</head>
<body>

  <div class="corner tl"></div>
  <div class="corner tr"></div>

  <!-- Navigation -->
  <nav id="top-nav">
    <a class="brand" href="index.html">ÉNIGMES CRIMINELLES</a>
    <div class="links">
      <a data-page="affaires" href="affaires.html">Affaires</a>
      <a data-page="carte" href="carte.html" class="active-link">Carte</a>
      <a data-page="livres" href="livres.html">Livres</a>
      <a data-page="compte" id="nav-compte" href="inscription.html">Mon compte</a>
    </div>
  </nav>

  <!-- Carte plein écran -->
  <div id="map-paris"></div>

  <!-- Légende -->
  <div id="carte-legende">
    <div class="leg-titre">Légende</div>
    <div class="leg-row"><div class="leg-dot or"></div><span class="leg-label">Affaire ouverte</span></div>
    <div class="leg-row"><div class="leg-dot vert"></div><span class="leg-label">Affaire résolue</span></div>
    <div class="leg-row"><div class="leg-dot gris"></div><span class="leg-label">Affaire verrouillée</span></div>
    <div class="leg-sep"></div>
    <div class="leg-progress" id="leg-progress">0 / 20 résolues</div>
    <div class="leg-grade" id="leg-grade"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WPeE=" crossorigin=""></script>
  <script src="./js/auth.js"></script>
  <script>
    requireLogin();

    /* ── Favicon ── */
    (function () {
      var fc = document.createElement('canvas'); fc.width = fc.height = 32;
      var x = fc.getContext('2d');
      x.fillStyle = '#0a0a0a'; x.fillRect(0,0,32,32);
      x.strokeStyle = '#c9a84c'; x.lineWidth = 2.5; x.lineCap = 'round';
      x.beginPath(); x.arc(13,13,7,0,Math.PI*2); x.stroke();
      x.beginPath(); x.moveTo(18,18); x.lineTo(26,26); x.stroke();
      var lk = document.createElement('link'); lk.rel='icon'; lk.href=fc.toDataURL();
      document.head.appendChild(lk);
    }());

    /* ── Données des affaires ── */
    var POINTS = [
      {id:1,  titre:'La Nuit du Palais Royal',     niveau:1, lat:48.8638, lng:2.3370},
      {id:2,  titre:'Le Dernier Train de Lyon',    niveau:1, lat:48.8448, lng:2.3735},
      {id:3,  titre:"Rue des Orfèvres",            niveau:1, lat:48.8550, lng:2.3472},
      {id:4,  titre:'Le Bal Masqué',               niveau:1, lat:48.8738, lng:2.3323},
      {id:5,  titre:'La Chambre Froide',           niveau:1, lat:48.8628, lng:2.3490},
      {id:6,  titre:'Le Cabinet du Docteur',       niveau:1, lat:48.8462, lng:2.3372},
      {id:7,  titre:"L'Incendie du Théâtre",       niveau:1, lat:48.8719, lng:2.3320},
      {id:8,  titre:'Le Port de Marseille',        niveau:2, lat:48.8408, lng:2.3668},
      {id:9,  titre:'La Pension du Lac',           niveau:2, lat:48.8448, lng:2.2463},
      {id:10, titre:'La Galerie des Glaces',       niveau:2, lat:48.8704, lng:2.3132},
      {id:11, titre:'Le Monastère des Brumes',     niveau:2, lat:48.8530, lng:2.3499},
      {id:12, titre:'La Villa des Roses',          niveau:2, lat:48.8378, lng:2.2652},
      {id:13, titre:"L'Exposition Universelle",    niveau:2, lat:48.8584, lng:2.2945},
      {id:14, titre:"Le Cirque d'Hiver",           niveau:2, lat:48.8635, lng:2.3489},
      {id:15, titre:'Les Catacombes',              niveau:3, lat:48.8339, lng:2.3323},
      {id:16, titre:'Le Bal de la Préfecture',     niveau:3, lat:48.8551, lng:2.3465},
      {id:17, titre:'Le Quai des Brumes',          niveau:3, lat:48.8516, lng:2.3524},
      {id:18, titre:'L\'Atelier du Sculpteur',     niveau:3, lat:48.8844, lng:2.3313},
      {id:19, titre:'La Librairie Fantôme',        niveau:3, lat:48.8534, lng:2.3408},
      {id:20, titre:'Le Dernier Acte',             niveau:3, lat:48.8830, lng:2.3430}
    ];

    var BADGES = {1:'★☆☆', 2:'★★☆', 3:'★★★'};

    function getGrade(n) {
      if (n >= 20) return 'Détective en Chef ★★★★★';
      if (n >= 15) return 'Commissaire Divisionnaire ★★★★';
      if (n >= 10) return 'Commissaire ★★★';
      if (n >= 5)  return 'Inspecteur ★★';
      return 'Inspecteur Stagiaire ★';
    }

    /* ── Init carte ── */
    document.addEventListener('DOMContentLoaded', function() {
      var prog = getProgression();
      var resolues = prog.affairesResolues || [];

      // Légende
      document.getElementById('leg-progress').textContent = resolues.length + ' / 20 résolues';
      document.getElementById('leg-grade').textContent = getGrade(resolues.length);

      var map = L.map('map-paris', {
        center: [48.8566, 2.3522],
        zoom: 13,
        zoomControl: true,
        attributionControl: true
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap © CARTO',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      setTimeout(function() { map.invalidateSize(); }, 100);

      POINTS.forEach(function(p) {
        var resolue    = resolues.indexOf(p.id) !== -1;
        var verrouillee = !resolue && p.id > 1 && resolues.indexOf(p.id - 1) === -1;

        var cls = resolue ? 'marker-resolu' : verrouillee ? 'marker-verrouille' : 'marker-ouvert';
        var inner = resolue ? '✓' : verrouillee ? '🔒' : p.id;

        var icon = L.divIcon({
          className: '',
          html: '<div class="marker-pin ' + cls + '">' + inner + '</div>',
          iconSize: [28, 28],
          iconAnchor: [14, 14],
          popupAnchor: [0, -16],
          tooltipAnchor: [16, 0]
        });

        var marker = L.marker([p.lat, p.lng], {icon: icon}).addTo(map);

        // Tooltip
        var tipHtml =
          '<div class="tip-num">AFFAIRE N°' + String(p.id).padStart(2,'0') + '</div>' +
          '<div class="tip-titre">' + p.titre + '</div>' +
          '<div class="tip-badge" style="color:' + (p.niveau===3?'#c9a84c':p.niveau===2?'#aaa':'#cd7f32') + '">' + BADGES[p.niveau] + '</div>';
        marker.bindTooltip(tipHtml, {
          className: 'carte-tip',
          direction: 'right',
          permanent: false,
          offset: [8, 0]
        });

        // Popup
        var popupHtml;
        if (verrouillee) {
          popupHtml =
            '<div class="popup-inner">' +
              '<div class="popup-num">AFFAIRE N°' + String(p.id).padStart(2,'0') + '</div>' +
              '<div class="popup-titre">' + p.titre + '</div>' +
              '<div class="popup-msg">Cette affaire nécessite d\'avoir résolu les affaires précédentes.</div>' +
            '</div>';
        } else {
          popupHtml =
            '<div class="popup-inner">' +
              '<div class="popup-num">AFFAIRE N°' + String(p.id).padStart(2,'0') + ' &nbsp;' + BADGES[p.niveau] + '</div>' +
              '<div class="popup-titre">' + p.titre + '</div>' +
              (resolue ? '<div class="popup-msg" style="color:#4a9a40;">✓ Affaire résolue</div>' : '') +
              '<a class="popup-btn" href="affaires.html?affaire=' + p.id + '">' +
                (resolue ? 'Revoir le dossier →' : 'Ouvrir le dossier →') +
              '</a>' +
            '</div>';
        }
        marker.bindPopup(popupHtml, {
          maxWidth: 280,
          closeButton: false
        });
      });
    });
  </script>

</body>
</html>
