<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Énigmes Criminelles — Affaires</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Ornements de coin -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Navigation -->
  <nav id="top-nav">
    <a class="brand" href="index.html">ÉNIGMES CRIMINELLES</a>
    <div class="links">
      <a data-page="affaires" href="affaires.html" class="active-link">Affaires</a>
      <a data-page="carte" data-locked="true" href="carte.html">Carte</a>
      <a data-page="livres" href="livres.html">Livres</a>
      <a data-page="compte" id="nav-compte" href="inscription.html">Mon compte</a>
    </div>
  </nav>

  <main class="page-content">

    <!-- Vue sélection (par défaut) -->
    <div id="vue-selection">
      <div class="sel-header">
        <h2>DOSSIERS CLASSIFIÉS</h2>
        <p id="sel-progression">0 / 20 affaires résolues</p>
      </div>
      <div class="sel-niveaux">
        <!-- Niveau 1 -->
        <div class="sel-niveau">
          <div class="sel-niveau-header">
            <span class="sel-badge bronze">★☆☆</span>
            <h3>NIVEAU 1 — INSPECTEUR</h3>
            <p class="sel-niveau-desc">Mots horizontaux et verticaux</p>
          </div>
          <div class="sel-grid" id="sel-n1"></div>
        </div>
        <!-- Niveau 2 -->
        <div class="sel-niveau">
          <div class="sel-niveau-header">
            <span class="sel-badge argent">★★☆</span>
            <h3>NIVEAU 2 — COMMISSAIRE</h3>
            <p class="sel-niveau-desc">+ Mots en diagonale</p>
          </div>
          <div class="sel-grid" id="sel-n2"></div>
        </div>
        <!-- Niveau 3 -->
        <div class="sel-niveau">
          <div class="sel-niveau-header">
            <span class="sel-badge or">★★★</span>
            <h3>NIVEAU 3 — DÉTECTIVE</h3>
            <p class="sel-niveau-desc">+ Toutes directions et inversés</p>
          </div>
          <div class="sel-grid" id="sel-n3"></div>
        </div>
      </div>
    </div>

    <!-- Vue jeu (cachée par défaut, affichée au clic) -->
    <div id="vue-jeu" style="display:none;">
      <div class="jeu-back">
        <button id="btn-retour" class="btn">← Retour aux dossiers</button>
      </div>
      <div id="jeu-affaire-container"></div>
    </div>

  </main>

  <script src="js/auth.js"></script>
  <script>
    requireLogin();
  </script>
  <script src="js/affaires.js"></script>
  <script>
    /* ── Favicon ─────────────────────────────────────────────── */
    (function () {
      var fc = document.createElement('canvas');
      fc.width = fc.height = 32;
      var x = fc.getContext('2d');
      x.fillStyle = '#0a0a0a'; x.fillRect(0, 0, 32, 32);
      x.strokeStyle = '#c9a84c'; x.lineWidth = 2.5; x.lineCap = 'round';
      x.beginPath(); x.arc(13, 13, 7, 0, Math.PI * 2); x.stroke();
      x.beginPath(); x.moveTo(18, 18); x.lineTo(26, 26); x.stroke();
      var lk = document.createElement('link');
      lk.rel = 'icon'; lk.href = fc.toDataURL();
      document.head.appendChild(lk);
    }());

    /* ── Vue sélection ───────────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', function() {
      var user = getUser();
      var resolues = user ? (user.affairesResolues || []) : [];

      // Afficher progression
      document.getElementById('sel-progression').textContent = resolues.length + ' / 20 affaires résolues';

      // Remplir les grilles de niveaux
      var n1 = document.getElementById('sel-n1');
      var n2 = document.getElementById('sel-n2');
      var n3 = document.getElementById('sel-n3');

      AFFAIRES.forEach(function(aff) {
        var container = aff.niveau === 1 ? n1 : aff.niveau === 2 ? n2 : n3;
        var resolue = resolues.indexOf(aff.id) !== -1;
        var verrouillee = !resolue && aff.id > 1 && resolues.indexOf(aff.id - 1) === -1;

        var card = document.createElement('div');
        card.className = 'sel-card' + (resolue ? ' resolue' : '') + (verrouillee ? ' verrouillee' : '');
        card.innerHTML =
          '<div class="sel-num">N°' + String(aff.id).padStart(2,'0') + '</div>' +
          '<div class="sel-titre">' + aff.titre + '</div>' +
          '<div class="sel-statut ' + (resolue ? 'resolu' : 'ouvert') + '">' + (resolue ? '✓ Résolu' : 'Ouvert') + '</div>' +
          (resolue ? '<div class="sel-stamp-resolu"><span>RÉSOLU</span></div>' : '');

        if (!verrouillee) {
          card.addEventListener('click', function() { ouvrirAffaire(aff); });
        }
        container.appendChild(card);
      });

      // URL param ?affaire=X — ouvrir directement une affaire
      var params = new URLSearchParams(window.location.search);
      var affaireParam = params.get('affaire');
      if (affaireParam) {
        var targetId = parseInt(affaireParam, 10);
        var targetAff = AFFAIRES.find(function(a) { return a.id === targetId; });
        var verrou = targetAff && targetAff.id > 1 && resolues.indexOf(targetAff.id - 1) === -1 && resolues.indexOf(targetAff.id) === -1;
        if (targetAff && !verrou) ouvrirAffaire(targetAff);
      }
    });

    function ouvrirAffaire(aff) {
      document.getElementById('vue-selection').style.display = 'none';
      var jeu = document.getElementById('vue-jeu');
      jeu.style.display = 'block';

      var container = document.getElementById('jeu-affaire-container');
      container.innerHTML =
        '<div class="affaire-game">' +
          '<div class="ws-header" id="ws-hdr-' + aff.id + '"></div>' +
          '<div class="ws-body">' +
            '<div class="ws-grid" id="ws-grid-' + aff.id + '"></div>' +
            '<div class="ws-side">' +
              '<div id="ws-wlist-' + aff.id + '"></div>' +
              '<div class="ws-answer-section" id="ws-ans-' + aff.id + '"></div>' +
            '</div>' +
          '</div>' +
        '</div>';

      wsInitAffaire(aff);
    }

    document.getElementById('btn-retour').addEventListener('click', function() {
      document.getElementById('vue-jeu').style.display = 'none';
      document.getElementById('vue-selection').style.display = 'block';
      location.reload();
    });
  </script>

</body>
</html>
