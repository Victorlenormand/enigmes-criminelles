<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Énigmes Criminelles — Rejoindre l'enquête</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Ornements de coin -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Navigation -->
  <nav id="top-nav">
    <a class="brand" href="index.html">ÉNIGMES CRIMINELLES</a>
    <div class="links">
      <a data-page="affaires" data-locked="true" href="affaires.html">Affaires</a>
      <a data-page="carte" data-locked="true" href="carte.html">Carte</a>
      <a data-page="livres" href="livres.html">Livres</a>
      <a data-page="compte" id="nav-compte" href="inscription.html" class="active-link">Mon compte</a>
    </div>
  </nav>

  <main class="page-home">

    <!-- Tampon -->
    <div class="s1-stamp">
      <span class="s1-stamp-text">DOSSIER<br/>CLASSIFIÉ</span>
    </div>

    <h2>Rejoindre l'enquête</h2>
    <div class="divider"></div>

    <!-- Message contextuel -->
    <p id="context-msg" class="inscription-context-msg" style="display:none;"></p>

    <!-- Formulaire -->
    <div class="inscription-form">
      <input
        type="text"
        id="insc-nom"
        placeholder="Votre nom de code"
        autocomplete="off"
        maxlength="40"
      />
      <input
        type="email"
        id="insc-email"
        placeholder="Votre adresse email"
        autocomplete="email"
        maxlength="120"
        required
      />
      <p id="insc-email-error" class="s1-email-error" style="display:none;">
        Une adresse email valide est requise pour accéder au dossier.
      </p>
      <button class="s1-btn-open" id="insc-btn">
        &#9654;&nbsp; Rejoindre l'enquête
      </button>
    </div>

    <p style="font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.1em;color:var(--creme);opacity:0.3;margin-top:0.5rem;">
      Accès gratuit. Aucune carte bleue requise.
    </p>

  </main>

  <script src="js/mailerlite.js"></script>
  <script src="js/auth.js"></script>
  <script>
    /* ── Favicon ─────────────────────────────────────────────── */
    (function () {
      var fc = document.createElement('canvas');
      fc.width = fc.height = 32;
      var x = fc.getContext('2d');
      x.fillStyle = '#0a0a0a'; x.fillRect(0, 0, 32, 32);
      x.strokeStyle = '#c9a84c'; x.lineWidth = 2.5; x.lineCap = 'round';
      x.beginPath(); x.arc(13, 13, 7, 0, Math.PI * 2); x.stroke();
      x.beginPath(); x.moveTo(18, 18); x.lineTo(26, 26); x.stroke();
      var lk = document.createElement('link');
      lk.rel = 'icon'; lk.href = fc.toDataURL();
      document.head.appendChild(lk);
    }());

    document.addEventListener('DOMContentLoaded', function() {
      // Si déjà connecté, rediriger vers affaires
      if (isLoggedIn()) {
        window.location.href = 'affaires.html';
        return;
      }

      // Message contextuel selon ?from=
      var params = new URLSearchParams(window.location.search);
      var from = params.get('from');
      var msgEl = document.getElementById('context-msg');
      var messages = {
        'affaires': 'Créez votre compte gratuit pour accéder aux affaires.',
        'carte': 'Créez votre compte gratuit pour accéder à la carte des lieux.',
      };
      if (from && messages[from]) {
        msgEl.textContent = messages[from];
        msgEl.style.display = 'block';
      }
    });

    function inscSubmit() {
      var nom   = document.getElementById('insc-nom').value.trim() || 'Enquêteur';
      var email = document.getElementById('insc-email').value.trim();
      var errEl = document.getElementById('insc-email-error');

      var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      if (!emailOk) {
        errEl.style.display = 'block';
        document.getElementById('insc-email').focus();
        return;
      }
      errEl.style.display = 'none';

      subscribeToMailerLite(email, nom);
      login(email, nom);

      window.location.href = 'affaires.html';
    }

    document.getElementById('insc-btn').addEventListener('click', inscSubmit);
    document.getElementById('insc-nom').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('insc-email').focus();
    });
    document.getElementById('insc-email').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') inscSubmit();
    });
  </script>

</body>
</html>
